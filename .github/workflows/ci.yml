name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --group data --group models --group notebook --group tracking --group app
      - run: .venv/bin/ruff check src tests notebooks migrations
      - run: .venv/bin/ruff format --check src tests notebooks migrations
      - run: .venv/bin/pytest -q
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: .venv/bin/python -m src.interfaces.cli.online_prepare --demo --output data/app/ci-demo
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - run: .venv/bin/python -m src.interfaces.cli.online_public_demo --config data/app/ci-demo/config.json --output frontend/public/demo
      - run: npm run build:demo
        working-directory: frontend
