[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "music-recsys"
version = "0.1.0"
description = "Research on music recommendation with traditional models, LLMs, and agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
music-recsys-benchmark = "music_recsys.evaluation.benchmark:main"
music-recsys-profile = "music_recsys.music4all:main"
music-recsys-import = "music_recsys.ingestion.cli:main"
music-recsys-mlflow = "music_recsys.evaluation.tracking_server:main"
music-recsys-search = "music_recsys.experiment_search:main"

[tool.hatch.build.targets.wheel]
packages = ["src/music_recsys"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/docs",
    "/README.md",
    "/CONTRIBUTING.md",
    "/AGENTS.md",
    "/pyproject.toml",
    "/.python-version",
    "/.env.example",
    "/compose.yaml",
    "/alembic.ini",
    "/migrations",
    "/uv.lock",
    "/configs",
    "/notebooks",
    "/tests",
    "/data/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "notebook: executes the example notebook in a fresh Python kernel",
    "db: opt-in PostgreSQL integration tests in disposable schemas",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
models = ["numpy>=2,<3"]
data = [
    "duckdb>=1.4,<2",
    "pandas==3.0.6",
    "pyarrow>=19,<26",
]
db = [
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<2.1",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.13,<1",
]
notebook = [
    "ipykernel>=6,<8",
    "ipywidgets>=8,<9",
    "jupyterlab>=4,<5",
    "matplotlib>=3.9,<4",
    "nbclient>=0.10,<1",
]
tracking = [
    { include-group = "db" },
    "mlflow==3.17.0",
]
