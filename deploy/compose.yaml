name: music-recsys
services:
  app: &app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      MUSIC_RECSYS_RETENTION_DAYS: ${MUSIC_RECSYS_RETENTION_DAYS:-}
      MUSIC_RECSYS_API_TOKEN: ${MUSIC_RECSYS_API_TOKEN:-}
      MUSIC_RECSYS_NEXT_OPEN_AT: ${MUSIC_RECSYS_NEXT_OPEN_AT:-}
      MUSIC_RECSYS_MODEL_VERSION: ${MUSIC_RECSYS_MODEL_VERSION:-}
      MUSIC_RECSYS_ACCESS_TEAM: ${MUSIC_RECSYS_ACCESS_TEAM:-}
      MUSIC_RECSYS_ACCESS_AUD: ${MUSIC_RECSYS_ACCESS_AUD:-}
      MUSIC_RECSYS_ALLOWED_ORIGINS: ${MUSIC_RECSYS_ALLOWED_ORIGINS:-}
      MUSIC_RECSYS_ALLOWED_HOSTS: ${MUSIC_RECSYS_ALLOWED_HOSTS:-}
    volumes:
      - type: bind
        source: ${MUSIC_RECSYS_BUNDLE:?Set absolute MUSIC_RECSYS_BUNDLE path}
        target: /bundle
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MUSIC_RECSYS_STATE:?Set absolute MUSIC_RECSYS_STATE path}
        target: /state
        bind:
          create_host_path: false
  researcher:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        RESEARCH_CONTROL: ${MUSIC_RECSYS_RESEARCH_CONTROL:-0}
    profiles: [researcher]
    ports:
      - "127.0.0.1:8766:8765"
    command: [python, -m, src.interfaces.http.container, --audience, researcher]
    environment:
      MUSIC_RECSYS_RETENTION_DAYS: ${MUSIC_RECSYS_RETENTION_DAYS:-}
      MUSIC_RECSYS_CONTROL_CONFIG: ${MUSIC_RECSYS_CONTROL_CONFIG:-}
      MUSIC_RECSYS_DECISION_API_KEY: ${MUSIC_RECSYS_DECISION_API_KEY:-}
      MUSIC_RECSYS_LANGSMITH_API_KEY: ${MUSIC_RECSYS_LANGSMITH_API_KEY:-}
