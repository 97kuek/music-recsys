  <style>svg{color-scheme:light;font-family:Arial,"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}:root{color-scheme:light;--ink:#18273b;--muted:#65758a;--line:#dce4ee;--blue:#2b67b7;--purple:#7859b7;--green:#187f73;--orange:#b87528;--slate:#607287}.zone{--tone:var(--blue);--zone:#f5f9ff}.zone.blue{--tone:var(--blue);--zone:#f6f9ff}.zone.slate{--tone:var(--slate);--zone:#f8fafc}.zone.orange{--tone:var(--orange);--zone:#fffbf6}.zone.green{--tone:var(--green);--zone:#f1faf6}.zone.purple{--tone:var(--purple);--zone:#faf7ff}.zone&gt;rect{fill:var(--zone);stroke:var(--tone);stroke-opacity:.24;stroke-dasharray:5 5}.zone-title{font-size:15px;font-weight:700;fill:var(--tone)}.zone-desc{font-size:11px;fill:#778598}.node{--tone:var(--blue);--pale:#eaf1fc;cursor:pointer}.node.blue{--tone:var(--blue);--pale:#eaf1fc}.node.green{--tone:var(--green);--pale:#e4f4ed}.node.orange{--tone:var(--orange);--pale:#fff0de}.node.purple{--tone:var(--purple);--pale:#f1eafa}.node.slate{--tone:var(--slate);--pale:#edf1f6}.node-box{fill:white;stroke:#d7e1ee;stroke-width:1.1;filter:drop-shadow(0px 3px 4px #274c7406);transition:stroke .15s}.node .icon-bg{fill:var(--pale)}.node svg{fill:none;stroke:var(--tone);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.node-title{fill:#23364e;font-size:13px;font-weight:700}.node-desc{fill:#738197;font-size:10px}.node-badge{fill:var(--tone);font-size:9px;font-weight:700}.edge polyline{fill:none;stroke:#8292a7;stroke-width:1.4;stroke-linejoin:round}.edge.future-edge polyline{stroke:#9c85ba;stroke-dasharray:5 4}.edge rect{fill:#fff;fill-opacity:.96}.edge text{font-size:10.5px;fill:#627187}.svg-note{font-size:12px;fill:#76869a}</style>
  <rect width="1400" height="770" fill="#ffffff" />
  <g class="zone slate">
    <rect x="24" y="24" width="1352" height="180" rx="20" />
    <text x="46" y="54" class="zone-title">比較条件を揃えた3つの戦略</text>
    <text x="46" y="75" class="zone-desc">同じ初期プロフィール・候補・K・情報権限 / 予算と呼出し回数は条件に明記</text>
  </g>
  <g class="node green" aria-label="固定 / ルール: 固定Strategyは実装済み。研究者が指定した登録モデルを使う。決定的ルールによる選択は将来の比較条件として実装し、LLMなしの判断基準とする。">
    <rect x="55" y="93" width="270" height="90" rx="14" class="node-box" />
    <rect x="69" y="113" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="78" y="122" width="24" height="24">
      <use href="#i-route" />
    </svg>
    <text x="124" y="129" class="node-title">固定 / ルール</text>
    <text x="124" y="150" class="node-desc">FixedStrategy / ルールは将来</text>
  </g>
  <g class="node purple" aria-label="LLM 単発選択: 1回の意思決定で登録済み推薦器を選ぶ。結果を見た再判断は含めない。OpenAI Decisions APIのchoice等も将来候補として、固定選択と同じ候補・情報・予算で比較する。">
    <rect x="555" y="93" width="270" height="90" rx="14" class="node-box" />
    <rect x="569" y="113" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="578" y="122" width="24" height="24">
      <use href="#i-brain" />
    </svg>
    <text x="624" y="129" class="node-title">LLM 単発選択</text>
    <text x="624" y="150" class="node-desc">モデル・設定を1回判断</text>
    <text x="812" y="109" text-anchor="end" class="node-badge">将来</text>
  </g>
  <g class="node purple" aria-label="Agent 反復: 判断→tool実行→結果確認→再判断。複数回推薦を固定1回と同じ条件扱いにせず、最大step・推薦回数・LLM/tool call・時間/料金上限を比較計画へ記録する。">
    <rect x="1055" y="93" width="270" height="90" rx="14" class="node-box" />
    <rect x="1069" y="113" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="1078" y="122" width="24" height="24">
      <use href="#i-network" />
    </svg>
    <text x="1124" y="129" class="node-title">Agent 反復</text>
    <text x="1124" y="150" class="node-desc">実行結果から次の行動を判断</text>
    <text x="1312" y="109" text-anchor="end" class="node-badge">将来</text>
  </g>
  <g class="zone purple">
    <rect x="355" y="253" width="1021" height="420" rx="20" />
    <text x="377" y="283" class="zone-title">将来のオーケストレーション層 · 既存サービスの上に接続</text>
    <text x="377" y="304" class="zone-desc">LLM / Agent / LangChain / LangGraph / LangSmithは未実装、現行の必須依存ではない</text>
  </g>
  <g class="node purple" aria-label="LangChain: 将来案: モデルとtoolの接続に使う。LangChainのagentはLangGraph上に構築される。単発選択では直接SDK等も選べ、フレームワーク導入を研究比較の条件と混同しない。">
    <rect x="405" y="338" width="260" height="90" rx="14" class="node-box" />
    <rect x="419" y="358" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="428" y="367" width="24" height="24">
      <use href="#i-code" />
    </svg>
    <text x="474" y="374" class="node-title">LangChain</text>
    <text x="474" y="395" class="node-desc">モデル / toolの接続・共通化</text>
  </g>
  <g class="node purple" aria-label="LangGraph: 将来案: 状態付きグラフで、予測可能な処理とLLM判断を接続する。候補・step・call数・残予算をstateで管理し、停止とフォールバックを記録する。LangChainなしでも利用可能。">
    <rect x="785" y="338" width="265" height="90" rx="14" class="node-box" />
    <rect x="799" y="358" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="808" y="367" width="24" height="24">
      <use href="#i-network" />
    </svg>
    <text x="854" y="374" class="node-title">LangGraph</text>
    <text x="854" y="395" class="node-desc">状態・分岐・反復・停止制御</text>
  </g>
  <g class="node purple" aria-label="OpenAI Decisions API: 将来候補のOpenAI Decisions API。POST /v1/decisionsでpredicateの確率・固定選択肢choice・順序付きscoreを返す。登録済み推薦器や方針の判断に使う案。API自体がtoolを実行するものではなく、実行制御はアプリ/LangGraphが担う。採用と利用可能性・品質・latencyは未評価。">
    <rect x="405" y="535" width="270" height="90" rx="14" class="node-box" />
    <rect x="419" y="555" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="428" y="564" width="24" height="24">
      <use href="#i-globe" />
    </svg>
    <text x="474" y="571" class="node-title">OpenAI Decisions API</text>
    <text x="474" y="592" class="node-desc">方針・推薦器の選択 / 判定</text>
    <text x="662" y="551" text-anchor="end" class="node-badge">public beta</text>
  </g>
  <g class="node purple" aria-label="LangSmith: 将来案: LLM呼出し・tool実行・状態遷移を追跡し、評価へつなぐ。研究正本はMac/研究室の既定成果物。外部送信する場合は送信対象・保存同意・マスキングを別途確定し、自動送信しない。">
    <rect x="785" y="535" width="265" height="90" rx="14" class="node-box" />
    <rect x="799" y="555" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="808" y="564" width="24" height="24">
      <use href="#i-eye" />
    </svg>
    <text x="854" y="571" class="node-title">LangSmith</text>
    <text x="854" y="592" class="node-desc">trace / debug / evaluation</text>
    <text x="1037" y="551" text-anchor="end" class="node-badge">任意</text>
  </g>
  <g class="node green" aria-label="RecommendationService: 既存の共通Serviceを維持し、Strategyを差し替える。オーケストレーターは許可されたrecommend toolを呼ぶ。モデルファイル・DB・音源への任意アクセスを持たせない。">
    <rect x="55" y="338" width="265" height="90" rx="14" class="node-box" />
    <rect x="69" y="358" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="78" y="367" width="24" height="24">
      <use href="#i-network" />
    </svg>
    <text x="124" y="374" class="node-title">RecommendationService</text>
    <text x="124" y="395" class="node-desc">候補・登録モデル・応答検証</text>
  </g>
  <g class="node green" aria-label="登録済み推薦器: 固定されたModelSpecとmanifestで推薦する。現在の配信可否は方式ごとに異なり、全方式が同じonline機能を持つとは限らない。">
    <rect x="55" y="535" width="265" height="90" rx="14" class="node-box" />
    <rect x="69" y="555" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="78" y="564" width="24" height="24">
