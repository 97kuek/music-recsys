<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 653" aria-labelledby="deployment-title deployment-desc" width="1400" height="653" lang="ja" role="img">
  <title id="deployment-title">01 配置とUI・API・DB</title>
  <desc id="deployment-desc">被験者はAccessとTunnelを経由してMacのReactとFastAPIへ接続。FastAPIはRecommendationService、SQLite、必要曲のbundleを使う。チャットUIは将来案。</desc>
