  <style>svg{color-scheme:light;font-family:Arial,"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}:root{color-scheme:light;--ink:#18273b;--muted:#65758a;--line:#dce4ee;--blue:#2b67b7;--purple:#7859b7;--green:#187f73;--orange:#b87528;--slate:#607287}.zone{--tone:var(--blue);--zone:#f5f9ff}.zone.blue{--tone:var(--blue);--zone:#f6f9ff}.zone.slate{--tone:var(--slate);--zone:#f8fafc}.zone.orange{--tone:var(--orange);--zone:#fffbf6}.zone.green{--tone:var(--green);--zone:#f1faf6}.zone.purple{--tone:var(--purple);--zone:#faf7ff}.zone&gt;rect{fill:var(--zone);stroke:var(--tone);stroke-opacity:.24;stroke-dasharray:5 5}.zone-title{font-size:15px;font-weight:700;fill:var(--tone)}.zone-desc{font-size:11px;fill:#778598}.node{--tone:var(--blue);--pale:#eaf1fc;cursor:pointer}.node.blue{--tone:var(--blue);--pale:#eaf1fc}.node.green{--tone:var(--green);--pale:#e4f4ed}.node.orange{--tone:var(--orange);--pale:#fff0de}.node.purple{--tone:var(--purple);--pale:#f1eafa}.node.slate{--tone:var(--slate);--pale:#edf1f6}.node-box{fill:white;stroke:#d7e1ee;stroke-width:1.1;filter:drop-shadow(0px 3px 4px #274c7406);transition:stroke .15s}.node .icon-bg{fill:var(--pale)}.node svg{fill:none;stroke:var(--tone);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.node-title{fill:#23364e;font-size:13px;font-weight:700}.node-desc{fill:#738197;font-size:10px}.node-badge{fill:var(--tone);font-size:9px;font-weight:700}.edge polyline{fill:none;stroke:#8292a7;stroke-width:1.4;stroke-linejoin:round}.edge.future-edge polyline{stroke:#9c85ba;stroke-dasharray:5 4}.edge rect{fill:#fff;fill-opacity:.96}.edge text{font-size:10.5px;fill:#627187}.svg-note{font-size:12px;fill:#76869a}</style>
  <rect width="1400" height="653" fill="#ffffff" />
  <g class="zone slate">
    <rect x="24" y="26" width="282" height="600" rx="20" />
    <text x="46" y="56" class="zone-title">招待された被験者</text>
    <text x="46" y="77" class="zone-desc">ブラウザ / 同意 / 仮名セッション</text>
  </g>
  <g class="zone orange">
    <rect x="340" y="26" width="250" height="600" rx="20" />
    <text x="362" y="56" class="zone-title">Cloudflare</text>
    <text x="362" y="77" class="zone-desc">Access + Tunnel / Pages・Workersなし</text>
  </g>
  <g class="zone blue">
    <rect x="624" y="26" width="752" height="600" rx="20" />
    <text x="646" y="56" class="zone-title">個人Mac · 公開アプリの実行場所</text>
    <text x="646" y="77" class="zone-desc">内蔵SSD / 外付けSSDなし / 研究室は外部公開しない</text>
  </g>
  <g class="zone green">
    <rect x="650" y="210" width="700" height="183" rx="20" />
    <text x="672" y="240" class="zone-title">Docker · 1コンテナ</text>
    <text x="672" y="261" class="zone-desc">FastAPIがReact buildとAPIを同じoriginで配信</text>
  </g>
  <g class="node blue" aria-label="React 試聴UI: 説明・保存同意→初期選択→推薦・試聴→任意の満足度。現在は自由文チャットなし。">
    <rect x="54" y="112" width="220" height="90" rx="14" class="node-box" />
    <rect x="68" y="132" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="77" y="141" width="24" height="24">
      <use href="#i-music" />
    </svg>
    <text x="123" y="148" class="node-title">React 試聴UI</text>
    <text x="123" y="169" class="node-desc">初期選択・推薦・プレイヤー</text>
    <text x="261" y="128" text-anchor="end" class="node-badge">現行</text>
  </g>
  <g class="node purple" aria-label="チャットUI: 既存プレイヤーに対話入口を追加する将来案。会話内容の保存と外部LLM送信は、現行の参加同意とは分けて設計する。">
    <rect x="54" y="310" width="220" height="90" rx="14" class="node-box" />
    <rect x="68" y="330" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="77" y="339" width="24" height="24">
      <use href="#i-chat" />
    </svg>
    <text x="123" y="346" class="node-title">チャットUI</text>
    <text x="123" y="367" class="node-desc">対話・条件確認・推薦カード</text>
    <text x="261" y="326" text-anchor="end" class="node-badge">将来</text>
  </g>
  <g class="node orange" aria-label="Cloudflare Access: Accessで認証後にMacのTunnelへ接続する。研究ログへメール・Access JWT・cookieの生値を保存しない。">
    <rect x="355" y="112" width="220" height="90" rx="14" class="node-box" />
    <rect x="369" y="132" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="378" y="141" width="24" height="24">
      <use href="#i-lock" />
    </svg>
    <text x="424" y="148" class="node-title">Cloudflare Access</text>
    <text x="424" y="169" class="node-desc">被験者のアクセス認証</text>
  </g>
  <g class="node orange" aria-label="Cloudflare Tunnel: HTTPSをMacへ中継">
    <rect x="355" y="310" width="220" height="90" rx="14" class="node-box" />
    <rect x="369" y="330" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="378" y="339" width="24" height="24">
      <use href="#i-cloud" />
    </svg>
    <text x="424" y="346" class="node-title">Cloudflare Tunnel</text>
    <text x="424" y="367" class="node-desc">HTTPSをMacへ中継</text>
  </g>
  <g class="node blue" aria-label="cloudflared: Dockerコンテナはアプリの1個だけ。cloudflaredはMacホスト上で起動し、アプリのloopback待受へ転送する。">
    <rect x="690" y="112" width="220" height="90" rx="14" class="node-box" />
    <rect x="704" y="132" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="713" y="141" width="24" height="24">
      <use href="#i-cloud" />
    </svg>
    <text x="759" y="148" class="node-title">cloudflared</text>
    <text x="759" y="169" class="node-desc">Macホストで実行</text>
  </g>
  <g class="node green" aria-label="FastAPI: UI / 推薦 / 音声 / 同意API">
    <rect x="690" y="281" width="265" height="90" rx="14" class="node-box" />
    <rect x="704" y="301" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="713" y="310" width="24" height="24">
      <use href="#i-bolt" />
    </svg>
    <text x="759" y="317" class="node-title">FastAPI</text>
    <text x="759" y="338" class="node-desc">UI / 推薦 / 音声 / 同意API</text>
  </g>
  <g class="node green" aria-label="RecommendationService: 起動時にmanifestとhashを検証して重みをloadする。リクエストごとの学習・重み再読込みを行わない。Strategy・候補・応答を検証し、推論経路と時間を記録する。">
    <rect x="1080" y="281" width="245" height="90" rx="14" class="node-box" />
    <rect x="1094" y="301" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="1103" y="310" width="24" height="24">
      <use href="#i-network" />
    </svg>
    <text x="1149" y="317" class="node-title">RecommendationService</text>
    <text x="1149" y="338" class="node-desc">固定Strategy / 検証済みモデル</text>
  </g>
  <g class="node blue" aria-label="SQLite · state: Macの ~/music-recsys/state/sessions.sqlite。仮名ID・推薦・操作・満足度・期限を保存。Dockerの /state に永続mountし、本人削除と保持期限を適用する。">
    <rect x="650" y="475" width="220" height="90" rx="14" class="node-box" />
    <rect x="664" y="495" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="673" y="504" width="24" height="24">
      <use href="#i-db" />
    </svg>
    <text x="719" y="511" class="node-title">SQLite · state</text>
    <text x="719" y="532" class="node-desc">同意済み評価・操作ログ</text>
  </g>
  <g class="node blue" aria-label="配信用 bundle: Macの /bundle をread-only mount。実験者が固定した共通曲集合のみ。manifest・hash・音源権限を検証し、元データ全体はHTTP公開しない。">
    <rect x="900" y="475" width="220" height="90" rx="14" class="node-box" />
    <rect x="914" y="495" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="923" y="504" width="24" height="24">
      <use href="#i-box" />
    </svg>
    <text x="969" y="511" class="node-title">配信用 bundle</text>
    <text x="969" y="532" class="node-desc">モデル・catalog・必要MP3</text>
  </g>
  <g class="node slate" aria-label="非公開 source: Mac内蔵SSDの非公開保管。提供の連絡を受領済みだがファイル受領・展開サイズは未確認。sourceをDocker imageや配布ZIPへ含めない。">
    <rect x="1140" y="475" width="205" height="90" rx="14" class="node-box" />
    <rect x="1154" y="495" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="1163" y="504" width="24" height="24">
      <use href="#i-folder" />
    </svg>
    <text x="1209" y="511" class="node-title">非公開 source</text>
    <text x="1209" y="532" class="node-desc">Music4All元データ</text>
  </g>
