  <style>svg{color-scheme:light;font-family:Arial,"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}:root{color-scheme:light;--ink:#18273b;--muted:#65758a;--line:#dce4ee;--blue:#2b67b7;--purple:#7859b7;--green:#187f73;--orange:#b87528;--slate:#607287}.zone{--tone:var(--blue);--zone:#f5f9ff}.zone.blue{--tone:var(--blue);--zone:#f6f9ff}.zone.slate{--tone:var(--slate);--zone:#f8fafc}.zone.orange{--tone:var(--orange);--zone:#fffbf6}.zone.green{--tone:var(--green);--zone:#f1faf6}.zone.purple{--tone:var(--purple);--zone:#faf7ff}.zone&gt;rect{fill:var(--zone);stroke:var(--tone);stroke-opacity:.24;stroke-dasharray:5 5}.zone-title{font-size:15px;font-weight:700;fill:var(--tone)}.zone-desc{font-size:11px;fill:#778598}.node{--tone:var(--blue);--pale:#eaf1fc;cursor:pointer}.node.blue{--tone:var(--blue);--pale:#eaf1fc}.node.green{--tone:var(--green);--pale:#e4f4ed}.node.orange{--tone:var(--orange);--pale:#fff0de}.node.purple{--tone:var(--purple);--pale:#f1eafa}.node.slate{--tone:var(--slate);--pale:#edf1f6}.node-box{fill:white;stroke:#d7e1ee;stroke-width:1.1;filter:drop-shadow(0px 3px 4px #274c7406);transition:stroke .15s}.node .icon-bg{fill:var(--pale)}.node svg{fill:none;stroke:var(--tone);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.node-title{fill:#23364e;font-size:13px;font-weight:700}.node-desc{fill:#738197;font-size:10px}.node-badge{fill:var(--tone);font-size:9px;font-weight:700}.edge polyline{fill:none;stroke:#8292a7;stroke-width:1.4;stroke-linejoin:round}.edge.future-edge polyline{stroke:#9c85ba;stroke-dasharray:5 4}.edge rect{fill:#fff;fill-opacity:.96}.edge text{font-size:10.5px;fill:#627187}.svg-note{font-size:12px;fill:#76869a}</style>
  <rect width="1400" height="793" fill="#ffffff" />
  <g class="zone purple">
    <rect x="24" y="24" width="1352" height="110" rx="20" />
    <text x="46" y="54" class="zone-title">多段階推薦 · 将来の比較用パイプライン案</text>
    <text x="46" y="75" class="zone-desc">既存の推薦器・候補検証を再利用 / 全段階の統合・学習reranker・対話intent抽出は未実装</text>
  </g>
  <g class="node purple" aria-label="要求 / intent / 制約: 自然文intentの抽出は将来。初期選択はinitial_profile、実再生はplayback_historyとして別入力にする。未聴newと既聴repeatは学習窓に対する候補制約を共有する。">
    <rect x="55" y="195" width="275" height="90" rx="14" class="node-box" />
    <rect x="69" y="215" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="78" y="224" width="24" height="24">
      <use href="#i-chat" />
    </svg>
    <text x="124" y="231" class="node-title">要求 / intent / 制約</text>
    <text x="124" y="252" class="node-desc">目的・初期選択・実履歴</text>
  </g>
  <g class="node green" aria-label="候補集合を固定: 候補を作る段階から共通カタログ・new/repeat・実験固定曲・既知の音源可否を適用する。Validation/Test正解を候補生成・負例抽出・tool入力へ渡さない。">
    <rect x="465" y="195" width="310" height="90" rx="14" class="node-box" />
    <rect x="479" y="215" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="488" y="224" width="24" height="24">
      <use href="#i-filter" />
    </svg>
    <text x="534" y="231" class="node-title">候補集合を固定</text>
    <text x="534" y="252" class="node-desc">学習曲 ∩ 実験共通曲 ∩ 許可範囲</text>
  </g>
  <g class="node green" aria-label="候補生成器: Popularity / ItemCF / BM25 / ALS / BPR / Contentを候補源にする将来案。候補源ごとの条件・pool_size・不足や補完経路を記録し、最初から全部を必須実行しない。">
    <rect x="950" y="195" width="365" height="90" rx="14" class="node-box" />
    <rect x="964" y="215" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="973" y="224" width="24" height="24">
      <use href="#i-chip" />
    </svg>
    <text x="1019" y="231" class="node-title">候補生成器</text>
    <text x="1019" y="252" class="node-desc">Popularity · ItemCF · BM25</text>
  </g>
  <text class="svg-note" x="1020" y="272">ALS · BPR · Content</text>
  <g class="node purple" aria-label="融合 / RRF例: 小規模Runnerの重み付きRRFは実装済み。Phase 2の融合方式・組合せは未確定で、RRFは候補例。全件評価・配信への汎用統合は将来。">
    <rect x="950" y="390" width="365" height="90" rx="14" class="node-box" />
    <rect x="964" y="410" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="973" y="419" width="24" height="24">
      <use href="#i-shuffle" />
    </svg>
    <text x="1019" y="426" class="node-title">融合 / RRF例</text>
    <text x="1019" y="447" class="node-desc">同一候補内で順位を融合</text>
    <text x="1302" y="406" text-anchor="end" class="node-badge">統合は将来</text>
  </g>
  <g class="node purple" aria-label="再ランキング / 多様性: 候補外の曲を追加せず順位を調整する将来案。ルール/多様性制御/学習型などを候補として比較し、具体方式は未確定。LLM直接ランキング生成は現時点の主目的ではない。">
    <rect x="465" y="390" width="310" height="90" rx="14" class="node-box" />
    <rect x="479" y="410" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="488" y="419" width="24" height="24">
      <use href="#i-list" />
    </svg>
    <text x="534" y="426" class="node-title">再ランキング / 多様性</text>
    <text x="534" y="447" class="node-desc">意図適合・重複抑制・探索制御</text>
    <text x="762" y="406" text-anchor="end" class="node-badge">将来</text>
  </g>
  <g class="node green" aria-label="Playback / 権限検証: 既存の音源権限・playability検証を再利用。最終提示前にも状態を再検証し、未取得・再生不能・期限切れを区別。欠落を無断で別曲や他条件の曲で埋めない。">
    <rect x="55" y="390" width="275" height="90" rx="14" class="node-box" />
    <rect x="69" y="410" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="78" y="419" width="24" height="24">
      <use href="#i-lock" />
    </svg>
    <text x="124" y="426" class="node-title">Playback / 権限検証</text>
    <text x="124" y="447" class="node-desc">available / unknown / expired</text>
  </g>
  <g class="node blue" aria-label="React · 推薦カード: 曲一覧・プレイヤー">
    <rect x="55" y="590" width="275" height="90" rx="14" class="node-box" />
    <rect x="69" y="610" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="78" y="619" width="24" height="24">
      <use href="#i-music" />
    </svg>
    <text x="124" y="626" class="node-title">React · 推薦カード</text>
    <text x="124" y="647" class="node-desc">曲一覧・プレイヤー</text>
  </g>
  <g class="node blue" aria-label="同意済みfeedback: 表示と推薦生成は別イベント。初期選択・実試聴を区別し、like/skipをオフライン正解へ置換しない。ログを使ったモデル更新は、固定条件の比較中に自動で行わない。">
    <rect x="465" y="590" width="310" height="90" rx="14" class="node-box" />
    <rect x="479" y="610" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="488" y="619" width="24" height="24">
      <use href="#i-db" />
    </svg>
    <text x="534" y="626" class="node-title">同意済みfeedback</text>
    <text x="534" y="647" class="node-desc">impression / play / skip / rating</text>
  </g>
  <g class="node blue" aria-label="Evaluator / 研究ログ: 研究室では同じEvaluatorでValidation比較。オンラインではMacのSQLiteへ同意済みイベントと利用量を保存する。オンラインの行動・満足度とオフライン指標を同じ正解とみなさない。">
    <rect x="950" y="590" width="365" height="90" rx="14" class="node-box" />
    <rect x="964" y="610" width="42" height="42" rx="12" class="icon-bg" />
    <svg x="973" y="619" width="24" height="24">
      <use href="#i-chart" />
    </svg>
    <text x="1019" y="626" class="node-title">Evaluator / 研究ログ</text>
    <text x="1019" y="647" class="node-desc">4観点・経路・利用量・欠測</text>
  </g>
