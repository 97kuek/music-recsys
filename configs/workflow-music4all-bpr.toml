# 既存100ユーザーのValidation診断。主指標を事後選択せず、Testを実行しない。
[experiment]
name = "music4all-validation-bpr"
protocol = "listening-v2"
validation_dataset = "../data/benchmarks/model-suite/validation"
features = "../data/benchmarks/model-suite/features.json"
output = "../data/experiments/model-suite/traditional-final/bpr"
snapshot_id = "3b3115c3-5958-44fe-9705-31f647db8ac2"
split_id = "7d50f6c9-6835-4919-be91-1293ae0a6f1d"

[model]
name = "bpr"
[model.parameters]
iterations = 5
learning_rate = 0.05
regularization = 0.01

[search]
stage = "A"
seeds = [0, 42]
max_trials = 4
time_budget_seconds = 1800
[search.grid]
factors = [8, 16]

[evaluation]
window_days = [30, 90, 180]
primary_window_days = 90
day_weights = [0.0, 0.5, 1.0, 2.0]
primary_day_weight = 1.0

[selection]
k = 10
# task / metricは研究目的から事前に決めた別実験で指定する。

[tracking]
enabled = true
tracking_uri = "sqlite:///data/experiments/model-suite/tracking.db"
experiment_name = "music4all-model-suite-validation"
