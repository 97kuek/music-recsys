# 合成データでItemCFの2変数Grid Searchを確認する例。
[experiment]
name = "toy-itemcf-grid"
validation_dataset = "../examples/toy/workflow-validation.json"
test_dataset = "../examples/toy/workflow-test.json"
output = "../data/experiments/toy-itemcf"

[model]
name = "itemcf"

[search]
stage = "B"
seeds = [0, 42]
max_trials = 16
smoke_users = 3
smoke_train_users = 50
[search.grid]
neighbors = [1, 2, 3, 5]
similarity = ["cosine", "jaccard"]

[selection]
metric = "ndcg"
k = 10
direction = "maximize"

[tracking]
enabled = false

[comparison]
configs = ["workflow-toy.toml"]

[inspection.audio_files]
