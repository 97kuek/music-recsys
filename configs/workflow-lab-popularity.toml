# 研究室のファイル保存のみで準備する100ユーザー。動作確認・予備分析用。
[experiment]
name = "lab-100-popularity"
protocol = "listening-v2"
validation_dataset = "../data/benchmarks/lab-100/validation"
test_dataset = "../data/benchmarks/lab-100/test"
features = "../data/benchmarks/lab-100/features.json"
output = "../data/experiments/lab-100/popularity"

[model]
name = "popularity"

[search]
stage = "A"
seeds = [0, 42]
max_trials = 2
time_budget_seconds = 1800

[evaluation]
window_days = [30, 90, 180]
primary_window_days = 90
day_weights = [0.0, 0.5, 1.0, 2.0]
primary_day_weight = 1.0

[selection]
k = 10
# 主タスク・主指標は未決定。選択・固定・Test評価は決定後の別実験で行う。

[tracking]
enabled = true
tracking_uri = "sqlite:///data/experiments/lab-100/tracking.db"
experiment_name = "lab-100-popularity"
