# 合成データの操作確認専用。主指標は研究上の決定を意味しない。
[experiment]
name = "toy-listening-popularity"
protocol = "listening-v2"
validation_dataset = "../data/benchmarks/toy-listening/validation"
test_dataset = "../data/benchmarks/toy-listening/test"
output = "../data/experiments/toy-listening-popularity"

[model]
name = "popularity"

[search]
stage = "A"
seeds = [0, 42]
max_trials = 2

[evaluation]
window_days = [30, 90, 180]
primary_window_days = 90
day_weights = [0.0, 0.5, 1.0, 2.0]
primary_day_weight = 1.0

[selection]
task = "repeat"
metric = "graded_ndcg"
k = 10
direction = "maximize"

[tracking]
enabled = false

[comparison]
configs = ["workflow-listening-itemcf.toml"]
